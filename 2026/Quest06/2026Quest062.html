<!DOCTYPE html>
<html>
<head>
<title>Everybody Codes</title>
<style>
	div {
		font-family:monospace;
		font-size:100%;
	}
</style>
<script>
function recursivelyAddToSet(ingredients, productSheets) {

	let addedNew = false;

	ingredients.forEach((productSheet) => {
		if(productSheets.has(productSheet)) {
			productSheets.get(productSheet).forEach((component) => {
				if('NULL' != component && !ingredients.has(component)) {
	 				ingredients.add(component)
	                addedNew = true;
				}
			})
		}
	})

    // If new items were added, call recursively
    if (addedNew) {
        return recursivelyAddToSet(ingredients, productSheets);
    }

    return ingredients;
}

function everybodyCodesFunction(input) {

	const file = input.files[0];
	const reader = new FileReader();

	reader.onload = (event) => {
		const file = event.target.result;
		const allLines = file.split(/\r\n|\n/);

		let result = 0;	
		const usedIn = new Map()
		
		allLines.forEach((line) => {
			
			let product = line.split(':')
			let id = product[0]
			let components = product[1].split(',')

			components.forEach((component) => {
				if(!usedIn.has(component)) {
					usedIn.set(component,[id])
				}
				else {
					usedIn.get(component).push(id)
				}
			})
 		});

		const ingredients = new Set()
  		usedIn.get('NULL').forEach((component) => {
			ingredients.add(component)
		})
 		recursivelyAddToSet(ingredients, usedIn)

 		console.log(ingredients)
 		result = ingredients.size
 		
		document.getElementById('result').value = result;
	};

	reader.onerror = (event) => {
		alert(event.target.error.name);
	};

	reader.readAsText(file);
}

window.onload = function() {
	document.getElementById('file').addEventListener('change',function() {
		document.getElementById('result').value = 0;
		everybodyCodesFunction(this)
	})
}

</script>
</head>
<body>
	<input type="file" name="file" id="file" accept=".txt">
	<hr />
	<label for="result">Result</label>
	<textarea id="result"></textarea>
</body>
</html>
