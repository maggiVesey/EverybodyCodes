<!DOCTYPE html>
<html>
<head>
<title>Everybody Codes</title>
<script>

function everybodyCodesFunction(input) {

	const file = input.files[0];
	const reader = new FileReader();

	reader.onload = (event) => {
		const file = event.target.result;
		const allLines = file.split(/\r\n|\n/);

		let result = 0;
		const totalTimes = new Map()
		
		allLines.forEach((line) => {
			const results = line.split(/\s/);
			
			let id = (results[0].split('=')[1])
			let quest = (results[1].split('=')[1])
			let part = (results[2].split('=')[1])
			let time = parseInt(results[3].split('=')[1])
			
			if(!totalTimes.has(id)) {
				totalTimes.set(id,0)
			}
			totalTimes.set(id,totalTimes.get(id) + time)
			
 		});
//		console.log(totalTimes)
		
		const ranks = [...totalTimes.entries()].sort((a, b) => a[1] - b[1])
//		console.log(ranks)
		
		result = ranks.reduce((total, rank, index) => total + ((index+1) * rank[1]),0);
		document.getElementById('result').value = result;
	};

	reader.onerror = (event) => {
		alert(event.target.error.name);
	};

	reader.readAsText(file);
}

window.onload = function() {
	document.getElementById('file').addEventListener('change',function() {
		document.getElementById('result').value = 0;
		everybodyCodesFunction(this)
	})
}

</script>
</head>
<body>
	<input type="file" name="file" id="file" accept=".txt">
	<hr />
	<label for="result">Result</label>
	<textarea id="result"></textarea>
</body>
</html>
