<!DOCTYPE html>
<html>
<head>
<title>Everybody Codes</title>
<style>
	div {
		font-family:monospace;
		font-size:100%;
	}
</style>
<script>
function everybodyCodesFunction(input) {

	const file = input.files[0];
	const reader = new FileReader();

	reader.onload = (event) => {
		const file = event.target.result;
		const allLines = file.split(/\r\n|\n/);

		let result = 0;	
		
		const clouds = new Map()
		let firstCloud = 0
		let maxConnections = 0
 		
		let impulseStrength = 5
		
		allLines.forEach((line) => {
			
			let cloudData = line.split(', ')
			let id = parseInt(cloudData[0].split('=')[1])
			let energy = parseInt(cloudData[1].split('=')[1])
			const connections = cloudData[2].split('=')[1].split(',').map(Number)
			if(connections.length > maxConnections) {
				maxConnections = connections.length
				firstCloud = id
			}
			const newCloud = {energy:energy,connections:connections}
			clouds.set(id,newCloud)
 		});
		
		const stages = []
		stages.push({cloud:firstCloud,impulse:impulseStrength})
		
		do  {
			let currentStage = stages.shift()
			let currentCloud = clouds.get(currentStage.cloud)
			
			impulseStrength = currentStage.impulse
			currentCloud.energy += impulseStrength
			
			if(impulseStrength > 1) {
				currentCloud.connections.forEach((connection) => {
					stages.push({cloud:connection,impulse:impulseStrength - 1})
				})
			}
			impulseStrength--
		} while (stages.length > 0)
			
		result = [...clouds].reduce((total,cloud) => total += cloud[1].energy,0)
		
		document.getElementById('result').value = result;
	};

	reader.onerror = (event) => {
		alert(event.target.error.name);
	};

	reader.readAsText(file);
}

window.onload = function() {
	document.getElementById('file').addEventListener('change',function() {
		document.getElementById('result').value = 0;
		everybodyCodesFunction(this)
	})
}

</script>
</head>
<body>
	<input type="file" name="file" id="file" accept=".txt">
	<hr />
	<label for="result">Result</label>
	<textarea id="result"></textarea>
</body>
</html>
